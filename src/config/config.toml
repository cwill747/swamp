# swamp configuration
#
# Lives at $XDG_CONFIG_HOME/swamp/config.toml (usually ~/.config/swamp/config.toml).
# Written by `swamp init`; safe to edit. Missing values fall back to the
# defaults shown below.

[dashboard]
# New sessions use the workspace layout: a 32-cell Spaces/Agents sidebar beside
# details and a real shell. Set layout = "classic" to use the legacy panel grid.
# sidebar_width accepts 16 through 60 cells.
#
# Classic-only percentage settings are retained for backwards compatibility;
# existing values do not opt a config into the classic layout.
# layout = "workspace"
# sidebar_width = 32
#
#   worktrees_column — left column: worktrees + resources panes
#   ai_column        — middle column: ai-status + pr-status panes
#   shell_column     — right column: an interactive shell
worktrees_column = 33
ai_column = 34
shell_column = 33

[harness]
# Which AI coding agent runs in each worktree's agent pane:
#   "claude" — always Claude Code
#   "codex"  — always Codex
#   "choose" — pick per-worktree; press `h` in the worktrees pane to choose
#              (defaults to claude until you pick). The choice applies the next
#              time swamp builds that worktree's tab.
default = "claude"

[badges]
# Attention badges in Zellij tab names. A worktree tab shows "● <name>" while
# its agent waits for you. The dashboard tab shows "dashboard ●<n>" while <n>
# worktrees in other repos wait for you. Set to false to keep tab names as
# they are.
enabled = true

[notifications]
# Native desktop alerts when an agent needs input or finishes a turn.
# Uses terminal-notifier on macOS and notify-send on Linux, found on PATH.
# Missing tools/headless desktops are ignored. Set enabled = false to opt out.
enabled = true
waiting = true
finished = true
# Optional absolute path to the platform's notifier executable (no shell args):
# command = "/path/to/terminal-notifier"

# [logging]
# Diagnostic logging for debugging swamp itself — e.g. "why was a tab added?"
# or "what did that git refresh do?". The daemon writes a per-repo log file
# under $XDG_RUNTIME_DIR/swamp/<id>.log; inspect it with `swamp logs`.
#
#   level  — minimum severity recorded: "error", "warn", "info" (default),
#            "debug", or "trace".
#   filter — optional EnvFilter directive for per-target control; overrides
#            `level` when set. Example: "swamp::zellij=debug,info".
#
# The RUST_LOG environment variable overrides both when set.
# level = "info"
# filter = "swamp::zellij=debug,info"

# [slots]
# Reusable worktrees ("slots") named work1, work2, ... under the repository
# worktree root. `swamp slot alloc <branch>` checks a branch out into the first
# free slot, and `swamp slot release` detaches the slot again so its build
# caches stay warm. When every slot is busy, swamp creates a dedicated
# branch-named worktree instead.
#
#   pool_size — the most slots swamp creates (default 5). 0 turns the pool off.
#   autoclean — automatically clean merged branches (default true). Set false
#               to retain their worktrees and sessions until manual release.
#
#   hooks     — shell commands (run with `sh -c`) around slot operations:
#               "post-alloc" runs in the worktree after an allocation, and
#               "pre-release" runs in the slot before a release detaches it.
#               A failed pre-release hook stops the release unless you pass
#               --force; a failed post-alloc hook only prints a warning. Hooks
#               get SWAMP_WORKTREE, SWAMP_NAME, SWAMP_KIND, SWAMP_BRANCH, and
#               SWAMP_REPO_ROOT. Each hook has a 300-second limit by default.
#
# A repository can override pool_size/autoclean and add hooks in
# <git-common-dir>/swamp/config.toml (for a bare layout, .bare/swamp/config.toml).
# User hooks run first, then the repository's.
# pool_size = 5
# autoclean = true
#
# [[slots.hooks.pre-release]]
# run = "bazel shutdown"
#
# [[slots.hooks.post-alloc]]
# run = "direnv allow"
# timeout_secs = 60

# SSH hosts shown in the workspace dashboard. The remote account must have
# Swamp installed and be able to log in with OpenSSH without prompting.
# [ssh_hosts.dev]
# target = "dev-box"
# swamp_path = "/absolute/path/to/swamp"
